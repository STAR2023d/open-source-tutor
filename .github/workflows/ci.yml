name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_content.py

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/agents/pyproject.toml
      - run: pip install -e "tools/agents[dev]"
      - run: python -m pytest tools/agents -q

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mastery_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learner_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
